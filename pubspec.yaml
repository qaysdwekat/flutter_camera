name: flutter_camera
description: A Flutter package that provides a powerful and customizable camera interface. It allows users to capture photos, record videos, and access the camera with ease. The package supports iOS, Android, and all other platforms, offering smooth integration and high-quality camera functionality. It includes features like camera switching, flash control, and zooming, making it ideal for building media-centric applications.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.6.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  camera: 0.11.1
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

